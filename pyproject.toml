[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-dev-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "openai>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["src*"]
